appId: com.rebeldot.lerobotgui
productName: LeRobot Control
copyright: Copyright © 2026 RebelDot
directories:
  buildResources: build
  output: dist

# The default is "package everything in the project", so this list is all
# exclusions. The renderer, preload and main bundles in out/ are what actually
# runs; the source they were built from, the tests, the tooling and the local
# state are dead weight inside an installer — and env/ is a 1.5 GB Python
# environment that must never be shipped.
files:
  - '!src/**/*'
  - '!tests/**/*'
  - '!tools/**/*'
  - '!scripts/**/*'
  - '!.github/**/*'
  - '!.vscode/**/*'
  - '!build/**/*'
  - '!env/**/*'
  - '!venv/**/*'
  - '!.venv/**/*'
  - '!calibration/**/*'
  - '!samples/**/*'
  # Shipped through extraResources instead, so they are not also duplicated
  # inside the asar.
  - '!assets/**/*'
  - '!resources/**/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!vitest.config.{js,ts,mjs,cjs}'
  - '!electron-builder.yml'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!*.tsbuildinfo'
  - '!{PROJECT_DESCRIPTION.md,CLAUDE.md,README.md}'
  # LICENSE and NOTICE are kept: they cover material that ships inside the app.

# node-pty's native binding has to be dlopen'd from a real path, so it cannot
# live inside the asar.
asarUnpack:
  - node_modules/node-pty/**

# The Python bridge is spawned as a file, and the assets are fetched over the
# app's `arm://` scheme; both resolve through `process.resourcesPath` when
# packaged (see src/main/paths.ts).
extraResources:
  - from: resources/bridge
    to: bridge
  - from: assets
    to: assets

mac:
  target: [dmg, zip]
  category: public.app-category.developer-tools
  # No Developer ID certificate is configured, so the app is signed ad hoc
  # ("-"). Without any signature the bundle keeps Electron's own linker
  # signature, which no longer matches the packaged contents: `codesign --verify`
  # fails, and on Apple Silicon a downloaded copy is reported as damaged, with no
  # way to open it from the UI. An ad-hoc signature is valid, so macOS shows its
  # usual warning for apps from unidentified developers instead. See README.md.
  #
  # The hardened runtime is off because, signed ad hoc, it would refuse to load
  # the app's own frameworks (library validation needs a team identity).
  #
  # To sign with a real certificate: remove `identity` and `hardenedRuntime`
  # here and provide CSC_LINK / CSC_KEY_PASSWORD.
  identity: '-'
  hardenedRuntime: false
  extendInfo:
    NSCameraUsageDescription: LeRobot Control lists and previews connected cameras so you can pick one for teleoperation and recording.
    NSMicrophoneUsageDescription: Not used. Present only because camera capture APIs may request it.

win:
  target: [nsis]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  license: LICENSE

linux:
  target: [AppImage, deb]
  category: Development
  # `deb` refuses to build without a maintainer.
  maintainer: RebelDot <andrei.brumboiu@rebeldot.com>
  synopsis: GUI for setting up and operating LeRobot SO-100 / SO-101 arms

deb:
  # Setting `depends` replaces electron-builder's own list, so the first nine
  # entries repeat that list. The last two are libraries the Electron binary
  # links to that the list leaves out. A desktop install has them already. A
  # bare one (a container, a server image) does not, and there the app failed
  # to start with "libgbm.so.1: cannot open shared object file".
  # libasound2 carries a version because Ubuntu 24.04 renamed the package to
  # libasound2t64, and a second, unrelated package also claims the old name.
  # Only libasound2t64 claims it with a version, so only it satisfies this.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libgbm1
    - libasound2 (>= 1.0.17)
