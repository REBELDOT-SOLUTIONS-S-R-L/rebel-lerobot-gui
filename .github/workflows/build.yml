# Builds installers for all three platforms.
#
# Cross-compiling is not practical here: node-pty is a native module and has to
# be rebuilt against Electron for the target, and the macOS and Windows
# installers want their own toolchains. So each platform builds on its own
# runner, which is also the only way to get a signed macOS build later.
#
# Run it from the Actions tab to get the installers as artifacts of the run. Push a
# v* tag to also get a draft GitHub Release with the installers attached; a
# maintainer reviews the draft and publishes it.
name: build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: dist:mac
            python: python3
          # node-pty looks the program up on PATH by its exact file name, so on
          # Windows the smoke test has to be told `python.exe`.
          - os: windows-latest
            target: dist:win
            python: python.exe
          # Not ubuntu-latest: node-pty is compiled on the runner, and the result
          # needs at least the runner's glibc. Built on Ubuntu 26.04 it asked for
          # GLIBC_2.42 and failed to load on Ubuntu 24.04 and 22.04, so the
          # installed app had no pty. The oldest image keeps the installers
          # usable on 22.04 and everything newer.
          - os: ubuntu-22.04
            target: dist:linux
            python: python3
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The smoke test drives a stand-in for `lerobot-calibrate` through a pty,
      # which needs some Python on PATH.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Electron needs a display to open a window, which `npm run smoke` does.
      - name: Install Xvfb
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # Ubuntu 24.04 and newer restrict unprivileged user namespaces. Chromium then
      # falls back to its setuid sandbox helper, which is not root-owned in
      # node_modules, and Electron aborts at start. Lift the restriction instead.
      # Ubuntu 22.04 has no such setting, hence `|| true`.
      - name: Let Electron's sandbox start
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # `postinstall` rebuilds node-pty against this runner's Electron.
      - run: npm ci

      - name: Verify
        run: npm run verify
        if: runner.os != 'Linux'
        env:
          SMOKE_PYTHON: ${{ matrix.python }}

      - name: Verify (Linux)
        run: xvfb-run -a npm run verify
        if: runner.os == 'Linux'
        env:
          SMOKE_PYTHON: ${{ matrix.python }}

      # No certificates: Windows is unsigned and macOS is signed ad hoc (see
      # electron-builder.yml). To sign, add the secrets electron-builder documents
      # (CSC_LINK / CSC_KEY_PASSWORD, and APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD
      # / APPLE_TEAM_ID for notarization), drop this env block, and remove
      # `identity` and `hardenedRuntime` from electron-builder.yml.
      # The dist scripts pass `--publish never`: on CI electron-builder would
      # otherwise try to publish by itself and fail for lack of a token. The
      # release job below does the publishing.
      - name: Package
        run: npm run ${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Guard for the choice of Linux runner above: fail the build if the pty
      # module would not load on Ubuntu 22.04 (glibc 2.35).
      - name: Check the glibc the Linux build needs
        if: runner.os == 'Linux'
        run: |
          pty=dist/linux-unpacked/resources/app.asar.unpacked/node_modules/node-pty/build/Release/pty.node
          need=$(objdump -T "$pty" | grep -o 'GLIBC_[0-9.]*' | sort -V | tail -1)
          echo "pty.node needs $need"
          if [ "$(printf '%s\n' "$need" GLIBC_2.35 | sort -V | tail -1)" != "GLIBC_2.35" ]; then
            echo "::error::pty.node needs $need, which Ubuntu 22.04 (GLIBC_2.35) does not have"
            exit 1
          fi

      # Guard for `deb.depends` in electron-builder.yml: install the package on a
      # bare Ubuntu 22.04, where nothing is there by accident, and fail the build
      # if the app's binary still lacks a shared library.
      - name: Check the .deb brings every library it needs
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD/dist":/dist:ro ubuntu:22.04 bash -c '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            cp /dist/*.deb /tmp/
            apt-get install -y -qq /tmp/*.deb > /dev/null
            missing=$(ldd "/opt/LeRobot Control/rebel-lerobot-gui" | grep "not found" | tr -s "\t\n" "  " || true)
            if [ -n "$missing" ]; then
              echo "::error::the installed app lacks:$missing"
              exit 1
            fi
            echo "the installed app has every shared library it links to"
          '

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  # For a v* tag only: collect the installers from all three builds and attach
  # them to a draft release. It runs only if every platform built.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" installers/*
          --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME"
          --generate-notes
          --draft
